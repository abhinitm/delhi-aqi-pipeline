services:
  postgres:
    image: postgres:16
    container_name: aqi_postgres
    environment:
      POSTGRES_USER: aqi_user
      POSTGRES_PASSWORD: aqi_pass
      POSTGRES_DB: aqi_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:3.3.1
    container_name: aqi_airflow
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aqi_user:aqi_pass@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    depends_on:
      - postgres

volumes:
  pgdata: